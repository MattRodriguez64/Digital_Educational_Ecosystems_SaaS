version: "3.8"

services:
  elearn:
    image: digital-campus-elearn:swarm-v1

    environment:
      MOODLE_URL: "http://elearn.univ-demo.10.3.16.189.sslip.io:18081"
      MOODLE_DB_HOST: db-univ-demo
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodle
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}

    volumes:
      - moodledata:/var/www/moodledata

    networks:
      - backend
      - proxy-swarm

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.labels.campus_data == true

      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=proxy-swarm"
        - "traefik.http.routers.univ-demo-elearn.rule=Host(`elearn.univ-demo.10.3.16.189.sslip.io`)"
        - "traefik.http.routers.univ-demo-elearn.entrypoints=web"
        - "traefik.http.routers.univ-demo-elearn.service=univ-demo-elearn"
        - "traefik.http.services.univ-demo-elearn.loadbalancer.server.port=80"

      resources:
        reservations:
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 512M

      restart_policy:
        condition: on-failure
        delay: 10s

  mariadb:
    image: mariadb:11.4

    environment:
      MARIADB_DATABASE: moodle
      MARIADB_USER: moodle
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--innodb-buffer-pool-size=128M"
      - "--max-connections=50"

    volumes:
      - db_data:/var/lib/mysql

    networks:
      backend:
        aliases:
          - db-univ-demo

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      placement:
        constraints:
          - node.labels.campus_data == true

      resources:
        reservations:
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 512M

      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  backend:
    driver: overlay
    attachable: true
    internal: true
  proxy-swarm:
    external: true

volumes:
  db_data:
  moodledata:
