version: "3.8"

services:
  portail:
    image: digital-campus-portail:swarm-v1
    environment:
      UNIV_NAME: "Universite Test"
      UNIV_COUNTRY: "France"
      UNIV_DOMAIN: "10.3.16.189"
    networks:
      - proxy-swarm
    deploy:
      replicas: 2
      endpoint_mode: dnsrr
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=proxy-swarm"
        - "traefik.http.routers.campus-portail.rule=Host(`10.3.16.189`)"
        - "traefik.http.routers.campus-portail.entrypoints=web"
        - "traefik.http.routers.campus-portail.service=campus-portail"
        - "traefik.http.services.campus-portail.loadbalancer.server.port=80"
      resources:
        reservations:
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 256M
      restart_policy:
        condition: on-failure
networks:
  proxy-swarm:
    external: true
