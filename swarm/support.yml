version: "3.8"

services:
  support:
    image: digital-campus-support:swarm-v1

    networks:
      - proxy-swarm
      - campus-backend

    deploy:
      replicas: 1
      endpoint_mode: dnsrr

      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=proxy-swarm"
        - "traefik.http.routers.campus-support.rule=Host(`support.10.3.17.216.sslip.io`)"
        - "traefik.http.routers.campus-support.entrypoints=web"
        - "traefik.http.routers.campus-support.service=campus-support"
        - "traefik.http.services.campus-support.loadbalancer.server.port=80"

      resources:
        reservations:
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 256M

      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  proxy-swarm:
    external: true
  campus-backend:
    external: true
