version: "3.8"

services:
  management:
    image: localhost:5000/digital-campus-management:swarm-v1

    environment:
      DB_HOST: mariadb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORTAINER_URL: ${PORTAINER_URL}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
      CAMPUS_BASE_DOMAIN: ${CAMPUS_BASE_DOMAIN}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD}
      MOODLE_DEMO_PASSWORD: ${MOODLE_DEMO_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_DEMO_PASSWORD: ${NEXTCLOUD_DEMO_PASSWORD}
      PORTAINER_TLS_VERIFY: ${PORTAINER_VERIFY_TLS}
      DATA_NODE_HOSTNAME: ${DATA_NODE_HOSTNAME}
      PUBLIC_PORT: ${PUBLIC_PORT}
      SUPPORT_SECRET: ${SUPPORT_SECRET}
    networks:
      - proxy-swarm
      - campus-backend

    deploy:
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.hostname == ${DATA_NODE_HOSTNAME:-debian}
      labels:
        - "traefik.enable=true"
        - "traefik.swarm.network=proxy-swarm"
        - "traefik.http.routers.campus-management.rule=Host(`gestion.${CAMPUS_BASE_DOMAIN:-10.3.17.216.sslip.io}`)"
        - "traefik.http.routers.campus-management.entrypoints=web"
        - "traefik.http.routers.campus-management.service=campus-management"
        - "traefik.http.services.campus-management.loadbalancer.server.port=80"

      resources:
        reservations:
          memory: 64M
        limits:
          cpus: "0.50"
          memory: 256M

      restart_policy:
        condition: on-failure
        delay: 5s

networks:
  proxy-swarm:
    external: true
  campus-backend:
    external: true
