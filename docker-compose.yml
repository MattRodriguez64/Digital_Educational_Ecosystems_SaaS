services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dashboard.service=api@internal
    networks:
      - proxy

  portail:
    image: php:8.3-apache
    restart: unless-stopped
    volumes:
      - ./portail:/var/www/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.portail.rule=Host(`moncompte.localhost`) || Host(`localhost`)
      - traefik.http.services.portail.loadbalancer.server.port=80
    networks:
      - proxy

  support:
    build: ./support
    restart: unless-stopped
    volumes:
      - ./support:/var/www/html:ro
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.support.rule=Host(`support.localhost`)
      - traefik.http.services.support.loadbalancer.server.port=80
    networks:
      - proxy
      - backend

  elearn:
    build: ./elearn
    restart: unless-stopped
    environment:
      MOODLE_URL: http://elearn.localhost
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: ${DB_NAME}
      MOODLE_DB_USER: ${DB_USER}
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.elearn.rule=Host(`elearn.localhost`)
      - traefik.http.services.elearn.loadbalancer.server.port=80
    networks:
      - proxy
      - backend

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./mariadb/initSupport.sql:/docker-entrypoint-initdb.d/initSupport.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.localhost`)
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    networks:
      - proxy
  elasticsearch:
      image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
      container_name: elasticsearch_container_elearn
      environment:
          - discovery.type=single-node
          - xpack.security.enabled=false
      ports:
          - "9200:9200"
      volumes:
          - elastic_data:/usr/share/elasticsearch/data
  kibana:
      image: docker.elastic.co/kibana/kibana:9.5.4
      container_name: kibana_container_elearn
      ports:
          - "5601:5601"
      environment:
          - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      depends_on:
          - elasticsearch
      healthcheck:
          test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
          interval: 10s
          timeout: 5s
          retries: 30
          start_period: 30s
  logstash:
      image: docker.elastic.co/logstash/logstash:9.5.4
      container_name: logstash_container_elearn
      ports:
          - "5044:5044"
      depends_on:
          - elasticsearch
      volumes:
          - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
  metricbeat:
      image: docker.elastic.co/beats/metricbeat:9.5.4
      container_name: metricbeat_container_elearn
      user: root
      command: ["metricbeat", "-e", "--strict.perms=false"]
      volumes:
          - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
          - /var/run/docker.sock:/var/run/docker.sock:ro
      depends_on:
          - elasticsearch

networks:
  proxy:
    name: proxy
  backend:
    internal: true

volumes:
  moodledata:
  db_data:
  portainer_data:
  elastic_data:
