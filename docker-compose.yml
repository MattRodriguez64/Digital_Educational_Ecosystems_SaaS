name: dee_saas
services:

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
    - --providers.docker=true
    - --providers.docker.exposedbydefault=false
    - --entrypoints.web.address=:80
    - --api.dashboard=true
    ports:
    - 80:80
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
    - traefik.enable=true
    - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
    - traefik.http.routers.dashboard.service=api@internal
    networks:
    - proxy

  support:
    build: ./apps/support
    restart: unless-stopped
    environment:
      SUPPORT_SECRET: ${SUPPORT_SECRET}
    volumes:
    - ./apps/support:/var/www/html:ro
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy
    - traefik.http.routers.support.rule=Host(`support.localhost`)
    - traefik.http.services.support.loadbalancer.server.port=80
    networks:
    - proxy
    - backend

  # admin:
  #   image: php:8.3-apache
  #   restart: unless-stopped
  #   volumes:
  #   - ./apps/admin-legacy/src:/var/www/html:ro
  #   labels:
  #   - traefik.enable=true
  #   - traefik.http.routers.admin.rule=Host(`admin.localhost`)
  #   - traefik.http.services.admin.loadbalancer.server.port=80
  #   networks:
  #   - proxy
  #   - backend

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
    - db_data:/var/lib/mysql
    - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    - ./infrastructure/database/management-grants.sh:/docker-entrypoint-initdb.d/zz-management-grants.sh:ro
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
    - backend

  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - portainer_data:/data
    labels:
    - traefik.enable=true
    - traefik.http.routers.portainer.rule=Host(`portainer.localhost`)
    - traefik.http.services.portainer.loadbalancer.server.port=9000
    networks:
    - proxy

  elasticsearch:
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null
      interval: 10s
      timeout: 6s
      retries: 24
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
    - discovery.type=single-node
    - xpack.security.enabled=false
    ports:
    - 9200:9200
    volumes:
    - elastic_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    ports:
    - 5601:5601
    environment:
    - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
    - elasticsearch
    healthcheck:
      test:
      - CMD-SHELL
      - curl -s http://localhost:5601/api/status | grep -q '"level":"available"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.4
    ports:
    - 5044:5044
    depends_on:
    - elasticsearch
    volumes:
    - ./infrastructure/monitoring/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    - ./infrastructure/monitoring/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    - ./infrastructure/monitoring/pipeline.conf:/usr/share/logstash/pipeline/campus.conf:ro

  metricbeat:
    image: docker.elastic.co/beats/metricbeat:9.5.4
    user: root
    command:
    - metricbeat
    - -e
    - --strict.perms=false
    volumes:
    - ./infrastructure/monitoring/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
    - elasticsearch

  campus-admin:
    build:
      context: .
      dockerfile: apps/management/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORTAINER_URL: https://portainer:9443
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-3}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
      SUPPORT_SECRET: ${SUPPORT_SECRET}
    volumes:
    - ./apps/management/src:/var/www/html:ro
    - ./template/university:/var/www/templates:ro
    - campus_dashboard_links:/var/lib/campus:ro
    labels:
    - traefik.enable=true
    - traefik.docker.network=proxy
    - traefik.http.routers.campus-admin.rule=Host(`gestion.localhost`)
    - traefik.http.services.campus-admin.loadbalancer.server.port=80
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
    - proxy
    - default
    - backend
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://localhost/
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  campus-collector:
    restart: unless-stopped
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - campus_dashboard_links:/links
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
      kibana:
        condition: service_started
    build:
      context: ./infrastructure/monitoring
      dockerfile: Dockerfile
    init: true
    
networks:
  proxy:
    name: proxy
    external: true
  backend:
    internal: true

volumes:
  db_data: 
  portainer_data: 
  elastic_data: 
  campus_dashboard_links: 
