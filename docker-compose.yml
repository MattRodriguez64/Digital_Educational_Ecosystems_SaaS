services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dashboard.service=api@internal
    networks:
      - proxy

  portail:
    image: digital-campus-portail:v1
    build:
      context: ./campus/services/portail/src
      dockerfile: ../../php-apache.Dockerfile
    restart: unless-stopped
    volumes:
      - ./portail:/var/www/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.portail.rule=Host(`moncompte.localhost`) || Host(`localhost`)
      - traefik.http.services.portail.loadbalancer.server.port=80
    networks:
      - proxy

  support:
    image: digital-campus-support:v1
    build:
      context: ./support
      dockerfile: ../campus/services/php-apache.Dockerfile
    restart: unless-stopped
    volumes:
      - ./support:/var/www/html:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.support.rule=Host(`support.localhost`)
      - traefik.http.services.support.loadbalancer.server.port=80
    networks:
      - proxy

  elearn:
    image: digital-campus-elearn:dev
    build: ./elearn
    restart: unless-stopped
    environment:
      MOODLE_URL: http://elearn.localhost
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: ${DB_NAME}
      MOODLE_DB_USER: ${DB_USER}
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.elearn.rule=Host(`elearn.localhost`)
      - traefik.http.services.elearn.loadbalancer.server.port=80
    networks:
      - proxy
      - backend

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend
  portainer:
    image: portainer/portainer-ce:lts
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.portainer.rule=Host(`portainer.localhost`)
      - traefik.http.services.portainer.loadbalancer.server.port=9000
    networks:
      - proxy
  elasticsearch:
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
        interval: 10s
        timeout: 6s
        retries: 24
      image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
      container_name: elasticsearch_container_elearn
      environment:
          - discovery.type=single-node
          - xpack.security.enabled=false
      ports:
          - "9200:9200"
      volumes:
          - elastic_data:/usr/share/elasticsearch/data
  kibana:
      image: docker.elastic.co/kibana/kibana:9.5.4
      container_name: kibana_container_elearn
      ports:
          - "5601:5601"
      environment:
          - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      depends_on:
          - elasticsearch
      healthcheck:
          test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
          interval: 10s
          timeout: 5s
          retries: 30
          start_period: 30s
  logstash:
      image: docker.elastic.co/logstash/logstash:9.5.4
      container_name: logstash_container_elearn
      ports:
          - "5044:5044"
      depends_on:
          - elasticsearch
      volumes:
          - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
          - ./campus/monitoring/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
          - ./campus/monitoring/pipeline.conf:/usr/share/logstash/pipeline/campus.conf:ro
  metricbeat:
      image: docker.elastic.co/beats/metricbeat:9.5.4
      container_name: metricbeat_container_elearn
      user: root
      command: ["metricbeat", "-e", "--strict.perms=false"]
      volumes:
          - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
          - /var/run/docker.sock:/var/run/docker.sock:ro
      depends_on:
          - elasticsearch

  campus-admin:
    build:
      context: ./campus/services/admin
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORTAINER_URL: https://portainer:9443
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-3}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
    volumes:
      - ./campus/services/admin/src:/var/www/html:ro
      - ./campus/services/admin/templates:/var/www/templates:ro
      - campus_dashboard_links:/var/lib/campus:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.campus-admin.rule=Host(`gestion.localhost`)
      - traefik.http.services.campus-admin.loadbalancer.server.port=80
    depends_on:
      campus-billing-init:
        condition: service_completed_successfully
    networks: [proxy, default, campus_db]

  # Isoler les comptes administrateur et les factures de la base Moodle existante.
  campus-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: admin_saas
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - campus_admin_data:/var/lib/mysql
      - ./campus/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [campus_db]

  campus-billing-init:
    image: mariadb:11.4
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    command: ["sh", "-ec", "mariadb -h campus-db -u \"$$DB_USER\" admin_saas < /billing.sql"]
    volumes:
      - ./campus/database/billing.sql:/billing.sql:ro
    depends_on:
      campus-db:
        condition: service_healthy
    networks: [campus_db]

  campus-collector:
    image: php:8.3-apache
    restart: unless-stopped
    command: ["php", "/collector.php"]
    volumes:
      - ./campus/monitoring/collector.php:/collector.php:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      logstash:
        condition: service_started
      campus-metrics-setup:
        condition: service_completed_successfully
  campus-metrics-setup:
    image: php:8.3-apache
    command: ["php", "/setup.php"]
    volumes:
      - ./campus/monitoring/setup.php:/setup.php:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
  campus-dashboard-setup:
    image: php:8.3-apache
    command: ["php", "/dashboards.php"]
    volumes:
      - ./campus/monitoring/dashboards.php:/dashboards.php:ro
      - campus_dashboard_links:/links
    depends_on: [kibana]

networks:
  campus_db:
    internal: true
  proxy:
    name: proxy
  backend:
    internal: true

volumes:
  moodledata:
  db_data:
  portainer_data:
  elastic_data:
  campus_admin_data:
  campus_dashboard_links:
