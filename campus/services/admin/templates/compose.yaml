services:
  portail:
    image: digital-campus-portail:v1
    restart: unless-stopped
    environment:
      UNIV_DOMAIN: ${UNIV_DOMAIN}
      UNIV_NAME: ${UNIV_NAME}
      UNIV_COUNTRY: ${UNIV_COUNTRY}
    labels:
      - traefik.enable=true
      - traefik.http.routers.portail-${UNIV_SLUG}.rule=Host(`moncompte.${UNIV_DOMAIN}`) || Host(`${UNIV_DOMAIN}`)
      - traefik.http.routers.portail-${UNIV_SLUG}.entrypoints=web
      - traefik.http.routers.portail-${UNIV_SLUG}.service=portail-${UNIV_SLUG}
      - traefik.http.services.portail-${UNIV_SLUG}.loadbalancer.server.port=80
    networks:
      - proxy

  support:
    image: digital-campus-support:v1
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.support-${UNIV_SLUG}.rule=Host(`support.${UNIV_DOMAIN}`)
      - traefik.http.routers.support-${UNIV_SLUG}.entrypoints=web
      - traefik.http.routers.support-${UNIV_SLUG}.service=support-${UNIV_SLUG}
      - traefik.http.services.support-${UNIV_SLUG}.loadbalancer.server.port=80
    networks:
      - proxy

  elearn:
    image: digital-campus-elearn:dev
    restart: unless-stopped
    environment:
      MOODLE_URL: http://elearn.${UNIV_DOMAIN}
      MOODLE_DB_HOST: db-${UNIV_SLUG}
      MOODLE_DB_NAME: ${DB_NAME}
      MOODLE_DB_USER: ${DB_USER}
      MOODLE_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      mariadb:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.elearn-${UNIV_SLUG}.rule=Host(`elearn.${UNIV_DOMAIN}`)
      - traefik.http.routers.elearn-${UNIV_SLUG}.entrypoints=web
      - traefik.http.routers.elearn-${UNIV_SLUG}.service=elearn-${UNIV_SLUG}
      - traefik.http.services.elearn-${UNIV_SLUG}.loadbalancer.server.port=80
    networks:
      - proxy
      - backend

  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      backend:
        aliases:
          - "db-${UNIV_SLUG}"

networks:
  proxy:
    name: proxy
    external: true
  backend:
    internal: true

volumes:
  moodledata:
  db_data:
  portainer_data:
