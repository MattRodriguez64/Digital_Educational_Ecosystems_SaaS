# Le collecteur regroupe déjà les services par université. Un document représente
# un relevé complet, ce qui évite de compter plusieurs fois une même stack.
input {
  http {
    port => 8080
    threads => 1
  }
}

filter {
  # Ignorer les conteneurs qui ne font pas partie d'une stack universitaire.
  if [university] !~ /^univ-[a-z0-9][a-z0-9-]*$/ {
    drop {}
  }
  # Le mois de facturation dépend de l'heure du relevé, même s'il arrive en retard.
  date {
    match => ["sampled_at", "ISO8601"]
  }
  mutate {
    add_field => { "billing_period" => "%{+yyyy-MM}" }
  }
  mutate {
    remove_field => ["sampled_at", "host", "url", "http", "user_agent", "@version"]
  }
}

output {
  # Chaque document porte une heure de relevés. La liste seen rend un rejeu
  # idempotent, même si les événements de cette heure arrivent dans le désordre.
  if [core_hours] {
    http {
      url => "http://elasticsearch:9200/campus-billing-hours-v1/_update/%{[university]}-%{+yyyyMMddHH}?retry_on_conflict=10"
      http_method => "post"
      content_type => "application/json"
      format => "message"
      message => '{
        "scripted_upsert": true,
        "upsert": {},
        "script": {
          "id": "campus-billing-sample",
          "params": {
            "t": "%{@timestamp}",
            "university": "%{university}",
            "period": "%{billing_period}",
            "cpu": %{core_hours},
            "memory": %{gib_hours},
            "network": %{traffic_gib}
          }
        }
      }'
    }
  }
  # En parallèle du cumul horaire, garder le relevé individuel pour les courbes Kibana.
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "campus-usage-%{+yyyy.MM.dd}"
    document_id => "%{[university]}-%{[@timestamp]}"
    ilm_enabled => false
    manage_template => false
    data_stream => false
  }
}
