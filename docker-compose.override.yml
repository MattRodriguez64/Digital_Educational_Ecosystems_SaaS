# Ce fichier complète docker-compose.yml ; Compose le charge automatiquement depuis la racine.
services:
  # Les images du projet restent distinctes de celles du dossier « plateforme - Copie ».
  portail:
    image: digital-campus-portail:v1
    build:
      context: ./campus/services/portail
      dockerfile: dockerfile
  support:
    image: digital-campus-support:v1
    build:
      context: ./campus/services/support
      dockerfile: dockerfile
  elearn:
    image: digital-campus-elearn:dev

  campus-admin:
    build:
      context: ./campus/services/admin
      dockerfile: dockerfile
    restart: unless-stopped
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORTAINER_URL: https://portainer:9443
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-3}
      PORTAINER_API_KEY: ${PORTAINER_API_KEY:-}
    volumes:
      - ./campus/services/admin/src:/var/www/html:ro
      - ./campus/services/admin/templates:/var/www/templates:ro
      - campus_dashboard_links:/var/lib/campus:ro
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.campus-admin.rule=Host(`gestion.localhost`)
      - traefik.http.services.campus-admin.loadbalancer.server.port=80
    depends_on:
      campus-billing-init:
        condition: service_completed_successfully
    networks: [proxy, default, campus_db]

  # Isoler les comptes administrateur et les factures de la base Moodle existante.
  campus-db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: admin_saas
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - campus_admin_data:/var/lib/mysql
      - ./campus/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [campus_db]

  campus-billing-init:
    image: mariadb:11.4
    environment:
      MYSQL_PWD: ${DB_PASSWORD}
      DB_USER: ${DB_USER}
    command: ["sh", "-ec", "mariadb -h campus-db -u \"$$DB_USER\" admin_saas < /billing.sql"]
    volumes:
      - ./campus/database/billing.sql:/billing.sql:ro
    depends_on:
      campus-db:
        condition: service_healthy
    networks: [campus_db]

  elasticsearch:
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 10s
      timeout: 6s
      retries: 24
  logstash:
    volumes:
      - ./campus/monitoring/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
      - ./campus/monitoring/pipeline.conf:/usr/share/logstash/pipeline/campus.conf:ro
  campus-collector:
    image: php:8.3-apache
    restart: unless-stopped
    command: ["php", "/collector.php"]
    volumes:
      - ./campus/monitoring/collector.php:/collector.php:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      logstash:
        condition: service_started
      campus-metrics-setup:
        condition: service_completed_successfully
  campus-metrics-setup:
    image: php:8.3-apache
    command: ["php", "/setup.php"]
    volumes:
      - ./campus/monitoring/setup.php:/setup.php:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
  campus-dashboard-setup:
    image: php:8.3-apache
    command: ["php", "/dashboards.php"]
    volumes:
      - ./campus/monitoring/dashboards.php:/dashboards.php:ro
      - campus_dashboard_links:/links
    depends_on: [kibana]

networks:
  campus_db:
    internal: true

volumes:
  campus_admin_data:
  campus_dashboard_links:
